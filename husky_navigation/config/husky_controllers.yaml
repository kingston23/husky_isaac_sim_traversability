controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    husky_velocity_controller:
      type: diff_drive_controller/DiffDriveController

husky_velocity_controller:
  ros__parameters:
    use_sim_time: true

    # CHECK that these match the names in the generated URDF
    left_wheel_names:  ["front_left_wheel_joint",  "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.5708
    wheel_radius: 0.1651

    # Husky is skid-steer: the wheels must slip when turning, so it behaves
    # as if the track were wider than it geometrically is. 1.5 is a common
    # starting point — calibrate until a command of 1.0 rad/s actually
    # produces 1.0 rad/s in /odom.
    wheel_separation_multiplier: 1.5
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link

    # true = this controller publishes odom -> base_link.
    # Set to false if the Isaac OmniGraph or an EKF publishes it instead —
    # two publishers of the same transform will corrupt the TF tree.
    enable_odom_tf: false

    open_loop: false
    position_feedback: true

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    cmd_vel_timeout: 0.5

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0          # m/s
        has_acceleration_limits: true
        max_acceleration: 3.0      # m/s^2

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0          # rad/s
        has_acceleration_limits: true
        max_acceleration: 6.0      # rad/s^2
