# ============================================================
#  Dual EKF + navsat_transform for the Husky in Isaac Sim
# ============================================================
#
#  TF ownership -- this is the part that matters most:
#
#    ekf_odom   publishes  odom -> base_link
#    ekf_map    publishes  map  -> odom
#    Isaac      publishes  base_link -> {wheels, sensors}
#
#  In husky_odom_tf_graph.py you MUST set PUBLISH_ODOM_TF = False.
#  If both Isaac and ekf_odom publish odom -> base_link, the TF tree breaks.
#
#  Likewise: diff_drive_controller must have enable_odom_tf: false.
#
#  Odometry source:
#    odom0 is /odom/noisy -- the drifted copy produced by
#    odom_drift_node.py. Never point this at Isaac's raw /odom:
#    that is ground truth, and an EKF fed ground truth has nothing
#    to correct, which defeats the entire purpose of the setup.
#
#    Isaac's raw /odom stays reserved for two things:
#      - feeding gps_sim_node (the GPS must be independent of the drift)
#      - evaluating how well the EKF actually performs
#
# ============================================================


# ------------------------------------------------------------
#  LOCAL EKF  --  odom -> base_link
#  Smooth, continuous pose. No GPS, so no jumps.
#  This is what Nav2 uses for local planning.
# ------------------------------------------------------------
ekf_filter_node_odom:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: false               # ground robot; disable z, roll, pitch
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom              # <-- local filter

    # Wheel odometry.
    # Order: x, y, z, roll, pitch, yaw,
    #        vx, vy, vz, vroll, vpitch, vyaw,
    #        ax, ay, az
    # We take VELOCITIES, not positions: wheel-derived position drifts,
    # while velocity is instantaneous and honestly measured.
    odom0: /odom/noisy
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: yaw rate + forward acceleration.
    # We do NOT take orientation here -- the local filter should be smooth,
    # not absolutely referenced.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

    process_noise_covariance: [0.05, 0.05, 0.06, 0.03, 0.03, 0.06,
                               0.025, 0.025, 0.04, 0.01, 0.01, 0.02,
                               0.01, 0.01, 0.015]


# ------------------------------------------------------------
#  GLOBAL EKF  --  map -> odom
#  Same inputs as above PLUS GPS. Allowed to jump when a fix arrives.
# ------------------------------------------------------------
ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map               # <-- global filter

    odom0: /odom/noisy
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # GPS, converted into the odom frame by navsat_transform_node.
    # Here we take POSITION (x, y) -- the only absolute reference available.
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,      # <-- here we DO take yaw
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    process_noise_covariance: [1.0,  1.0,  1e-3, 0.3,  0.3,  0.01,
                               0.5,  0.5,  0.1,  0.3,  0.3,  0.02,
                               0.1,  0.1,  0.015]


# ------------------------------------------------------------
#  NAVSAT TRANSFORM
#  NavSatFix (lat/lon) -> Odometry in a Cartesian frame
# ------------------------------------------------------------
navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0                     # wait for the TF tree to come up
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0                # 0 if IMU yaw=0 points East
    zero_altitude: true            # 2D robot, altitude only adds noise
    broadcast_utm_transform: true
    publish_filtered_gps: true

    # false = use the IMU for heading.
    # Set to true ONLY if you have no reliable absolute yaw.
    use_odometry_yaw: false

    # false = the first received fix becomes the origin.
    # For repeatable tests set true and specify the datum explicitly.
    wait_for_datum: false
    # datum: [45.8150, 15.9819, 0.0]
